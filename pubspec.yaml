name: love_care_global
description: "Love Care Global - Trusted Care, With Love. CEO-verified Nurses. Safe Clients."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - Core
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_database: ^10.4.0
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10

  # Storage / Files
  shared_preferences: ^2.2.2
  file_picker: ^6.1.1
  image_picker: ^1.0.7

  # Sound / Vibration / Notification
  audioplayers: ^5.2.1
  vibration: ^1.8.4
  flutter_local_notifications: ^16.3.2
  permission_handler: ^11.3.0

  # Maps / Location - FIX FOR book_nurse, book_nurse_50, sos, nurse_dashboard
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0

  # Share / Links
  share_plus: ^8.0.0
  url_launcher: ^6.2.4

  # Date / Format
  intl: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/sounds/

