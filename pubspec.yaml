name: love_care_global
description: LOVE CARE GLOBAL - Professional Online Nurse
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  firebase_database: ^11.3.0
  firebase_storage: ^12.3.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0 # FCM Push - phone alerts even when app is closed
  web: ^1.1.0
  just_audio: ^0.9.42
  audioplayers: ^6.4.0
  google_maps_flutter: ^2.10.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  share_plus: ^10.1.2
  video_player: ^2.9.5
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  # WEB OCR - for ID check. Works on Web.
  # DO NOT ADD google_mlkit_text_recognition - it is Android/iOS ONLY
  # and breaks flutter build web with "Couldn't resolve the package".
  http: ^1.2.0

dependency_overrides:
  firebase_auth_web: ^5.13.0
  firebase_core_web: ^2.20.0
  firebase_database_web: ^0.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
