name: love_care_global
description: "Love Care Global - Trusted Care, With Love"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===== FIREBASE - FOR ALL SCREENS =====
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_database: ^11.1.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.3.0
  cloud_functions: ^5.1.0
  firebase_crashlytics: ^4.1.0

  # ===== AUTH =====
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.0

  # ===== STATE / UTILS / STORAGE =====
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  package_info_plus: ^4.2.0
  uuid: ^4.5.0
  http: ^1.2.2
  dio: ^5.7.0

  # ===== MEDIA - Photo / Video / Audio / Sound =====
  image_picker: ^1.1.2
  video_player: ^2.9.2
  chewie: ^1.8.1
  camera: ^0.11.0
  audioplayers: ^6.1.0
  record: ^5.1.0
  flutter_sound: ^9.2.13
  file_picker: ^8.0.0
  cached_network_image: ^3.3.1
  image_cropper: ^8.0.1
  photo_view: ^0.15.0
  just_audio: ^0.9.46

  # ===== MAPS + LIVE TRACKING + LOCATION =====
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  location: ^7.0.0
  flutter_polyline_points: ^2.0.0
  map_launcher: ^3.0.0

  # ===== PAYMENT - Ghana + Global - For withdrawal, refund, increase-payment =====
  stripe: ^11.0.0
  paystack: ^1.0.0
  flutterwave: ^1.0.0
  pay_with_paystack: ^1.0.5

  # ===== CHAT + NOTIFICATIONS + ALERTS =====
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.0
  flutter_chat_ui: ^1.6.15
  flutter_chat_types: ^3.6.2
  emoji_picker_flutter: ^3.0.0
  audio_waveforms: ^1.0.0

  # ===== UI - Dashboard, Charts, Rating, SOS =====
  cupertino_icons: ^1.0.8
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  badges: ^3.1.2
  qr_flutter: ^4.1.0
  pin_code_fields: ^8.0.1
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^27.1.0
  table_calendar: ^3.1.2
  timeline_tile: ^2.0.0
  flutter_slidable: ^3.1.0
  expandable: ^5.0.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  flutter_sms: ^2.3.0
  vibration: ^2.0.0
  torch_light: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/audio/
    - assets/videos/
    - assets/sounds/
