name: love_care_global
description: LOVE CARE GLOBAL - Professional Online Nurse
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- Firebase - PINNED SET, do NOT mix old + new ----
  # firebase_auth_web 5.8.13 in your log is too OLD for Dart 3.9/3.10
  # (that is the 'PromiseJsImpl not found' error).
  # This set uses the new web interop and all resolve together.
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  firebase_database: ^11.3.0
  firebase_storage: ^12.3.0

  # ---- Web interop fix for PromiseJsImpl ----
  web: ^1.1.0

  # ---- Maps - THESE WERE MISSING, caused:
  # 'Couldn't resolve package flutter_map / latlong2'
  # in lib/screens/ceo_live_tracking_map.dart ----
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  # ---- Media / UI used across the app ----
  video_player: ^2.9.5
  just_audio: ^0.9.42
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  file_picker: ^8.1.4
  image_picker: ^1.1.2

  # ---- Location / permissions (used by tracking / registration) ----
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dependency_overrides:
  # Force the FIXED firebase_auth_web, even if another package
  # tries to pull the broken 5.8.13 version.
  firebase_auth_web: ^5.13.0
  firebase_core_web: ^2.20.0
  firebase_database_web: ^0.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
