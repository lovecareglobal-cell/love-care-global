name: love_care_global
description: "Love Care Global - Trusted Care, With Love"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===== FIREBASE - MUST HAVE =====
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.6

  # ===== BASIC - MUST HAVE =====
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  http: ^1.2.2
  uuid: ^4.5.0

  # ===== UI - SAFE ONES ONLY =====
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.3.1
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
