name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - name: Get packages
        run: flutter pub get

      # FIX 1: your repo is missing MainActivity + build.gradle.kts
      # Generate a clean v2 Android folder, but keep YOUR custom manifest
      # FIX 2: bump Kotlin to 2.3.0 - google_maps_flutter_android 2.19.8 needs it
      # FIX 3: create empty assets/ folder - pubspec.yaml lists it but it doesn't exist
      - name: Generate missing Android files
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/MyManifest.xml || true
          flutter create . --platforms=android --project-name love_care_global
          cp /tmp/MyManifest.xml android/app/src/main/AndroidManifest.xml || true
          mkdir -p assets
          # Bump Kotlin plugin wherever the template puts it
          sed -i 's/kotlin_version = .*/kotlin_version = "2.3.0"/g' android/build.gradle* 2>/dev/null || true
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.3.0"/g' android/settings.gradle* 2>/dev/null || true
          sed -i 's/org.jetbrains.kotlin.jvm" version "[^"]*"/org.jetbrains.kotlin.jvm" version "2.3.0"/g' android/settings.gradle* 2>/dev/null || true
          sed -i 's/kotlin-gradle-plugin:[^"]*/kotlin-gradle-plugin:2.3.0/g' android/build.gradle* 2>/dev/null || true
          grep -r "2.3.0" android/settings.gradle* android/build.gradle* || echo "Kotlin patch check done"
          flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: love-care-global-apk
          path: build/app/outputs/flutter-apk/app-release.apk
