name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.【entity-github¦canonical_name=GitHub】/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - name: Get packages
        run: flutter pub get

      # FIX: your repo is missing MainActivity + build.gradle.kts
      # Generate a clean v2 Android folder, but keep YOUR custom manifest
      - name: Generate missing Android files
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/MyManifest.xml || true
          flutter create . --platforms=android --project-name love_care_global
          cp /tmp/MyManifest.xml android/app/src/main/AndroidManifest.xml || true
          flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: love-care-global-apk
          path: build/app/outputs/flutter-apk/app-release.apk
