# .github/workflows/build-apk.yml - ROAD B: Build real APK
# Website workflow (build-web.yml) builds the WEBSITE only - it can NEVER make an APK.
# This workflow builds the APK. Put in: .github/workflows/build-apk.yml
# After push, go to: GitHub -> Actions -> Build APK -> download app-release.apk
name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: love-care-global-apk
          path: build/app/outputs/flutter-apk/app-release.apk
