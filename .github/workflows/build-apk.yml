name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - name: Get packages
        run: flutter pub get

      - name: Generate missing Android files + force Kotlin 2.3.0
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/MyManifest.xml || true
          flutter create . --platforms=android --project-name love_care_global
          cp /tmp/MyManifest.xml android/app/src/main/AndroidManifest.xml || true
          mkdir -p assets
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.9.2" apply false
              id "org.jetbrains.kotlin.android" version "2.3.0" apply false
              id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
          }
          include ":app"
          EOF
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.3.0" apply false
              id("dev.flutter.flutter-gradle-plugin") version "1.0.0" apply false
          }
          include(":app")
          EOF
          flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: love-care-global-apk
          path: build/app/outputs/flutter-apk/app-release.apk
