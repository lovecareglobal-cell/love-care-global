name: Build Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PIN Flutter - 'stable' floating forward is what broke
      # firebase_auth_web 5.8.13 (PromiseJsImpl) in your last run.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: "stable"
          cache: true

      - run: flutter --version
      - run: flutter clean
      - run: flutter pub get

      # Build for GitHub Pages: base-href MUST match repo name
      - run: flutter build web --release --base-href /lovecareglobal-cell.github.io/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
