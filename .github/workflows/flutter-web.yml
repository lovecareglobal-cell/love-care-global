name: Build Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: "stable"
          cache: true
      - run: flutter --version
      - run: flutter clean
      - run: flutter pub get
      # FIX: this repo is a USER site (lovecareglobal-cell.github.io)
      # so base-href MUST be "/" — NOT "/lovecareglobal-cell.github.io/"
      # The old value made the browser look for
      # /lovecareglobal-cell.github.io/main.dart.js which does NOT exist
      # -> blank white page, even though the build was green.
      - run: flutter build web --release --base-href /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
