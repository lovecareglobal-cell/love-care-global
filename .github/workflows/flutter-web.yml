name: Build Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: "stable"
          cache: true
      - run: flutter --version
      - run: flutter clean
      - run: flutter pub get
      # CORRECT base-href for THIS repo:
      # Repo = lovecareglobal-cell/love-care-global  (a PROJECT repo, not a user-site repo)
      # GitHub Pages URL = https://lovecareglobal-cell.github.io/love-care-global/
      # So base-href MUST be /love-care-global/
      # "/" was wrong -> app looked for files at the root, found nothing -> blank white
      # "/lovecareglobal-cell.github.io/" was also wrong -> same blank white
      - run: flutter build web --release --base-href /love-care-global/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
