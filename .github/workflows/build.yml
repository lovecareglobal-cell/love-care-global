name: Build Flutter APK + AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.4'

      - name: Fix pubspec - camera + assets
        run: |
          if ! grep -q "image_picker:" pubspec.yaml; then
            echo "  image_picker: ^1.1.2" >> pubspec.yaml
          fi
          if ! grep -q "permission_handler:" pubspec.yaml; then
            echo "  permission_handler: ^11.3.1" >> pubspec.yaml
          fi
          mkdir -p assets
          touch assets/.gitkeep
          cat pubspec.yaml

      - name: Get packages
        run: flutter pub get

      - name: Replace old Android folder with fresh v2 folder
        run: |
          rm -rf android
          PROJ=$(grep -m1 '^name:' pubspec.yaml | sed 's/name: *//;s/ *//g')
          if [ -z "$PROJ" ]; then PROJ="lovecare"; fi
          echo "Project: $PROJ"
          flutter create . --platforms android --org com.ecareglobal --project-name "$PROJ"
          echo "=== Fresh settings ==="
          cat android/settings.gradle.kts

      - name: Fix Android - Java 17 + Kotlin 2.3.10 + Desugaring
        run: |
          python3 - << 'PYEOF'
          import pathlib, re
          # 1. Force Kotlin 2.3.10 in settings
          for p in [pathlib.Path("android/settings.gradle.kts"), pathlib.Path("android/settings.gradle")]:
              if p.exists():
                  t = p.read_text()
                  t = re.sub(r'(org\.jetbrains\.kotlin\.android["\']?\s*\)\s*version\s*["\'])[0-9.]+', r'\g<1>2.3.10', t)
                  t = re.sub(r'kotlin_version\s*=\s*["\'][0-9.]+["\']', 'kotlin_version = "2.3.10"', t)
                  if "org.jetbrains.kotlin.android" not in t:
                      t = t.replace(
                          'id("dev.flutter.flutter-gradle-plugin")',
                          'id("org.jetbrains.kotlin.android") version "2.3.10" apply false\n    id("dev.flutter.flutter-gradle-plugin")'
                      )
                  p.write_text(t)
                  print(f"--- {p} ---")
                  print(t)
          # 2. Fix app/build.gradle.kts - compilerOptions DSL fix for Kotlin 2.3
          for p in [pathlib.Path("android/app/build.gradle.kts"), pathlib.Path("android/app/build.gradle")]:
              if not p.exists():
                  continue
              t = p.read_text()
              # Remove OLD broken style: kotlinOptions { jvmTarget = JavaVersion.VERSION_17.toString() }
              t = re.sub(
                  r'kotlinOptions\s*\{[^}]*jvmTarget[^}]*\}',
                  'compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }',
                  t,
                  flags=re.DOTALL
              )
              # If no compilerOptions at all, add am
              if "compilerOptions" not in t and "kotlinOptions" not in t:
                  t = t.replace("compileOptions {", "compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n    compileOptions {", 1)
              # Ensure Java 17
              t = t.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              t = t.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
              t = t.replace("VERSION_1_8", "VERSION_17")
              # Desugaring
              if "isCoreLibraryDesugaringEnabled" not in t:
                  t = t.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "desugar_jdk_libs" not in t:
                  t = t.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
              p.write_text(t)
              print(f"--- {p} ---")
              print(t)
          PYEOF

      - name: Add Camera + Storage permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in "CAMERA" "RECORD_AUDIO" "FLASHLIGHT" "READ_MEDIA_IMAGES" "READ_MEDIA_VIDEO"; do
            if ! grep -q "android.permission.$PERM" "$MANIFEST"; then
              sed -i "s|<manifest[^>]*>|&\n    <uses-permission android:name=\"android.permission.$PERM\" />|" "$MANIFEST"
            fi
          done
          if ! grep -q "android.hardware.camera" "$MANIFEST"; then
            sed -i 's|<application|<uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Build APK (Debug - for testing camera on phone)
        run: flutter build apk --debug

      - name: Build AAB (Release - for Play Store)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
