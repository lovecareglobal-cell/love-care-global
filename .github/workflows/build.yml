name: Build Flutter APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.4'

      - name: Fix pubspec - assets only
        run: |
          mkdir -p assets
          touch assets/.gitkeep
          cat pubspec.yaml

      - name: Get packages
        run: flutter pub get

      - name: Recreate Android folder FRESH (v2 embedding) - then re-apply fixes below
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "✅ Saved google-services.json"
          else
            echo "⚠️ NO google-services.json found! Upload it to android/app/ first!"
            ls -la android/app/
          fi
          # Old android/ folder is v1 embedding (deleted in Flutter 3.35).
          # Patching it failed. Delete it and let Flutter create a fresh v2 folder.
          # The steps BELOW re-add ML Kit + R8 fix, so nothing is lost.
          rm -rf android
          PROJ=$(grep -m1 '^name:' pubspec.yaml | sed 's/name: *//;s/ *//g')
          if [ -z "$PROJ" ]; then PROJ="love_care_global"; fi
          flutter create . --platforms android --org com.ecareglobal --project-name "$PROJ"
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
            echo "✅ Restored google-services.json"
          fi
          echo "=== Fresh MainActivity (should be v2) ==="
          find android/app/src/main -name "MainActivity.*"
          echo "=== Fresh Manifest (should have flutterEmbedding=2) ==="
          grep -n flutterEmbedding android/app/src/main/AndroidManifest.xml || echo "MISSING flutterEmbedding"

      - name: Fix Android - Firebase + Maps + Notifications + ML Kit R8 fix
        run: |
          python3 - << 'PYEOF'
          import pathlib, re
          for p in [pathlib.Path("android/settings.gradle.kts"), pathlib.Path("android/settings.gradle")]:
              if p.exists():
                  t = p.read_text()
                  t = re.sub(r'\s*id\(["\']com\.google\.gms\.google-services["\']\)[^\n]*', '', t)
                  if 'id("com.google.gms.google-services")' not in t:
                      if 'plugins {' in t:
                          t = t.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
                      else:
                          t = 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false\n}\n' + t
                  t = re.sub(r'(org\.jetbrains\.kotlin\.android["\']?\s*\)\s*version\s*["\'])[0-9.]+', r'\g<1>2.3.10', t)
                  if "org.jetbrains.kotlin.android" not in t:
                      t = t.replace('plugins {', 'plugins {\n    id("org.jetbrains.kotlin.android") version "2.3.10" apply false', 1)
                  p.write_text(t)
                  print(t)
          root = pathlib.Path("android/build.gradle.kts")
          if root.exists():
              root.write_text("allprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nval newBuildDir: Directory = rootProject.layout.buildDirectory.dir(\"../../build\").get()\nrootProject.layout.buildDirectory.value(newBuildDir)\nsubprojects {\n    val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)\n    project.layout.buildDirectory.value(newSubprojectBuildDir)\n}\nsubprojects {\n    project.evaluationDependsOn(\":app\")\n}\ntasks.register<Delete>(\"clean\") {\n    delete(rootProject.layout.buildDirectory)\n}\n")
          for p in [pathlib.Path("android/app/build.gradle.kts"), pathlib.Path("android/app/build.gradle")]:
              if not p.exists():
                  continue
              t = p.read_text()
              t = re.sub(r'kotlinOptions\s*\{[^}]*\}', '', t, flags=re.DOTALL)
              t = re.sub(r'compilerOptions\s*\{\s*jvmTarget[^}]*\}', '', t, flags=re.DOTALL)
              t = re.sub(r'.*isCoreLibraryDesugaringEnabled.*\n', '', t)
              t = re.sub(r'.*coreLibraryDesugaring.*\n', '', t)
              t = re.sub(r'.*desugar_jdk_libs.*\n', '', t)
              t = t.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              t = t.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
              t = t.replace("VERSION_1_8", "VERSION_17")
              t = t.replace("isMinifyEnabled = true", "isMinifyEnabled = false")
              if "isMinifyEnabled" not in t:
                  t = re.sub(r'(buildTypes\s*\{)', r'\1\n        release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }', t, count=1)
              else:
                  if "isShrinkResources" not in t:
                      t = t.replace("isMinifyEnabled = false", "isMinifyEnabled = false\n            isShrinkResources = false")
              if "com.google.gms.google-services" not in t:
                  if 'plugins {' in t:
                      t = t.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
                  else:
                      t = 'plugins {\n    id("com.google.gms.google-services")\n}\n' + t
              t = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', t, count=1)
              if "dependencies" in t:
                  t = re.sub(r'(dependencies\s*\{)', r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', t, count=1)
              else:
                  t = t.rstrip() + '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
              mlkit = [
                  'implementation("com.google.mlkit:text-recognition:16.0.0")',
                  'implementation("com.google.mlkit:text-recognition-chinese:16.0.0")',
                  'implementation("com.google.mlkit:text-recognition-devanagari:16.0.0")',
                  'implementation("com.google.mlkit:text-recognition-japanese:16.0.0")',
                  'implementation("com.google.mlkit:text-recognition-korean:16.0.0")',
              ]
              for line in mlkit:
                  if line not in t:
                      t = re.sub(r'(dependencies\s*\{)', r'\1\n    ' + line, t, count=1)
              if "kotlin {" not in t and "kotlin{" not in t:
                  t = t.rstrip() + "\n\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n}\n"
              p.write_text(t)
              print("=== FINAL android/app/build.gradle.kts ===")
              print(t)
          pro = pathlib.Path("android/app/proguard-rules.pro")
          pro.parent.mkdir(parents=True, exist_ok=True)
          pro.write_text("-keep class com.google.mlkit.** { *; }\n-keep class com.google.android.gms.** { *; }\n-dontwarn com.google.mlkit.**\n-dontwarn com.google.android.gms.**\n-dontwarn com.google.mlkit.vision.text.**\n-dontwarn com.google.mlkit.vision.text.chinese.**\n-dontwarn com.google.mlkit.vision.text.devanagari.**\n-dontwarn com.google.mlkit.vision.text.japanese.**\n-dontwarn com.google.mlkit.vision.text.korean.**\n")
          print("=== proguard-rules.pro written ===")
          PYEOF

      - name: Add Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in "CAMERA" "RECORD_AUDIO" "FLASHLIGHT" "READ_MEDIA_IMAGES" "READ_MEDIA_VIDEO" "POST_NOTIFICATIONS" "RECEIVE_BOOT_COMPLETED" "VIBRATE" "ACCESS_FINE_LOCATION" "ACCESS_COARSE_LOCATION"; do
            if ! grep -q "android.permission.$PERM" "$MANIFEST"; then
              sed -i "s|<manifest[^>]*>|&\n    <uses-permission android:name=\"android.permission.$PERM\" />|" "$MANIFEST"
            fi
          done
          if ! grep -q "android.hardware.camera" "$MANIFEST"; then
            sed -i 's|<application|<uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Generate App Icon from assets/icon.png
        run: |
          ls -lh assets/icon.png
          python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path("pubspec.yaml")
          t = p.read_text()
          t = t.replace("ios: true", "ios: false")
          if "ios: false" not in t:
              t = t.replace("android: true", "android: true\n  ios: false")
          p.write_text(t)
          print(p.read_text()[-400:])
          PYEOF
          dart run flutter_launcher_icons

      - name: Set App Name to Love Care Global
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Love Care Global"/' android/app/src/main/AndroidManifest.xml
          grep -n "android:label" android/app/src/main/AndroidManifest.xml

      - name: Show SHA fingerprints
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
