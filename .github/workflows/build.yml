name: Build Flutter APK + AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # V7: NO flutter-version pin - use latest stable (3.50) so Kotlin 2.3 matches google_maps plugin.
          # Pinning to 3.35.4 gave Kotlin 2.1.0, but google_maps needs 2.3.0 -> build failed.
      - name: Fix pubspec - camera + missing assets folder
        run: |
          sed -i -E 's/^([[:space:]]*camera:[[:space:]]*).*/\1 0.10.6/' pubspec.yaml || true
          if grep -q "assets/" pubspec.yaml; then
            mkdir -p assets
            touch assets/.gitkeep
          fi
          cat pubspec.yaml
      - name: Get packages
        run: flutter pub get
      - name: Replace old Android folder with fresh v2 folder
        run: |
          rm -rf android
          PROJ=$(grep -m1 '^name:' pubspec.yaml | sed 's/name: *//;s/ *//g')
          if [ -z "$PROJ" ]; then PROJ="lovecare"; fi
          echo "Project: $PROJ"
          flutter create . --platforms android --org com.ecareglobal --project-name "$PROJ"
          echo "=== Kotlin version in fresh template ==="
          grep -r "kotlin" android/settings.gradle* || true
      - name: Fix Android - Java 17 + Kotlin 2.3.10 + Desugaring
        run: |
          python3 - << 'PYEOF'
          import pathlib, re
          # 1. Force Kotlin 2.3.10 in settings.gradle.kts / settings.gradle - must match google_maps (2.3.0)
          for p in [pathlib.Path("android/settings.gradle.kts"), pathlib.Path("android/settings.gradle")]:
              if p.exists():
                  t = p.read_text()
                  # Replace any kotlin version 2.1.x / 2.2.x with 2.3.10
                  t = re.sub(r'(org\.jetbrains\.kotlin\.android[^\n]*?version\s*["\']?)[0-9]+\.[0-9]+\.[0-9]+', r'\g<1>2.3.10', t)
                  t = re.sub(r'(id\s*\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)\s*version\s*["\'])[0-9.]+', r'\g<1>2.3.10', t)
                  t = re.sub(r'kotlin_version\s*=\s*["\'][0-9.]+["\']', 'kotlin_version = "2.3.10"', t)
                  # If no version found at all, append explicit pluginManagement pin is handled by template - just log
                  p.write_text(t)
                  print(f"--- {p} ---")
                  print(t)
          # 2. Java 17 + Desugaring in app build.gradle.kts
          for p in [pathlib.Path("android/app/build.gradle.kts"), pathlib.Path("android/app/build.gradle")]:
              if not p.exists():
                  continue
              t = p.read_text()
              t = t.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              t = t.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
              if "isCoreLibraryDesugaringEnabled" not in t:
                  if "compileOptions" in t:
                      t = re.sub(r"(compileOptions\s*\{[^}]*?)(\})", r"\1\n        isCoreLibraryDesugaringEnabled = true\n    \2", t, count=1, flags=re.DOTALL)
                  else:
                      t = t.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)
              if "desugar_jdk_libs" not in t:
                  if "dependencies {" in t:
                      t = t.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
                  else:
                      t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
              p.write_text(t)
              print(f"--- {p} ---")
              print(t)
          PYEOF
      - name: Add Camera + Flashlight permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />|' "$MANIFEST"
          fi
          cat "$MANIFEST"
      - name: Build APK (Debug - for testing camera on phone)
        run: flutter build apk --debug
      - name: Build AAB (Release - for Play Store)
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
