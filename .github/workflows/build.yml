name: Build Flutter APK + AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.4'
      - name: Downgrade camera to avoid CameraX (0.11 pulls broken CameraX 1.5.3)
        run: |
          echo "=== Before ==="
          grep -i "camera" pubspec.yaml || true
          # Replace any camera: ^0.11.x / 0.11.x with 0.10.6 (Camera2, no CameraX)
          sed -i -E 's/^([[:space:]]*camera:[[:space:]]*).*/\1 0.10.6/' pubspec.yaml || true
          echo "=== After ==="
          cat pubspec.yaml
      - name: Get packages
        run: flutter pub get
      - name: Replace old Android folder with fresh v2 folder
        run: |
          rm -rf android
          PROJ=$(grep -m1 '^name:' pubspec.yaml | sed 's/name: *//;s/ *//g')
          if [ -z "$PROJ" ]; then PROJ="lovecare"; fi
          echo "Project: $PROJ"
          flutter create . --platforms android --org com.ecareglobal --project-name "$PROJ"
          # Force Java 17 in app build.gradle (both .kts and .gradle)
          for F in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$F" ]; then
              sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g; s/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g; s/JavaVersion.VERSION_1_7/JavaVersion.VERSION_17/g' "$F" || true
              sed -i 's/sourceCompatibility = 1.8/sourceCompatibility = 17/g; s/targetCompatibility = 1.8/targetCompatibility = 17/g' "$F" || true
              cat "$F"
            fi
          done
      - name: Add Camera + Flashlight permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />|' "$MANIFEST"
          fi
          cat "$MANIFEST"
      - name: Build APK (Debug - for testing camera on phone)
        run: flutter build apk --debug
      - name: Build AAB (Release - for Play Store)
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
