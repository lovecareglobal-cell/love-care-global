name: Build Flutter APK + AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get packages
        run: flutter pub get
      - name: Create Android folder if repo is Web-only
        run: |
          if [ ! -d "android" ]; then
            echo "No android folder - creating it (Flutter Web repo)"
            flutter create . --platforms android --org com.ecareglobal --project-name lovecare
          else
            echo "android folder exists - keeping it"
          fi
          ls android/app/src/main/
      - name: Add Camera + Flashlight permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />|' "$MANIFEST"
          fi
          cat "$MANIFEST"
      - name: Build APK (Debug - for testing camera on phone)
        run: flutter build apk --debug
      - name: Build AAB (Release - for Play Store)
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
