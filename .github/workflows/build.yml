name: Build Flutter APK + AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get packages
        run: flutter pub get
      - name: Create Android folder if repo is Web-only
        run: |
          if [ ! -d "android" ]; then
            echo "No android folder - creating it"
            flutter create . --platforms android --org com.ecareglobal --project-name lovecare
          else
            echo "android folder exists - keeping it"
          fi
          ls android/app/src/main/
      - name: Fix Android v1 embedding (Flutter 3.50 deleted v1)
        run: |
          # Find package name from build.gradle / AndroidManifest
          PKG=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' android/app/build.gradle* 2>/dev/null | head -1)
          if [ -z "$PKG" ]; then PKG=$(grep -oP 'package="\K[^"]+' android/app/src/main/AndroidManifest.xml | head -1); fi
          if [ -z "$PKG" ]; then PKG="com.ecareglobal.lovecare"; fi
          echo "Package: $PKG"
          # Path for MainActivity.kt
          DIR="android/app/src/main/kotlin/$(echo $PKG | tr '.' '/')"
          mkdir -p "$DIR"
          # Remove old v1 MainActivity (java or kotlin)
          find android/app/src/main -name "MainActivity.java" -delete || true
          find android/app/src/main -name "MainActivity.kt" -delete || true
          # Write new v2 MainActivity
          cat > "$DIR/MainActivity.kt" <<EOF
          package $PKG
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity : FlutterActivity()
          EOF
          cat "$DIR/MainActivity.kt"
          # Ensure flutterEmbedding = 2 in manifest
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'flutterEmbedding' "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|' "$MANIFEST"
          fi
          # Add Camera + Flashlight if missing
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />|' "$MANIFEST"
          fi
          cat "$MANIFEST"
      - name: Build APK (Debug - for testing camera on phone)
        run: flutter build apk --debug
      - name: Build AAB (Release - for Play Store)
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
