# .github/workflows/build-aab.yml - PLAY STORE: Build AAB (Android App Bundle)
# Play Store does NOT accept APK - it accepts AAB only.
# Put in: .github/workflows/build-aab.yml
# After push: GitHub -> Actions -> Build AAB -> download app-release.aab
# Then upload that .aab to Play Console, NOT the .apk.
name: Build AAB

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-aab.yml'
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build AAB (release - for Play Store)
        run: flutter build appbundle --release
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: love-care-global-aab
          path: build/app/outputs/bundle/release/app-release.aab
