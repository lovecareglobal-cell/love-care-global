name: Build AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - name: Get packages
        run: flutter pub get

      - name: Rebuild clean Android folder
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml || true
          cp android/app/google-services.json /tmp/backup/google-services.json || true
          cp android/app/src/main/res/raw/love_care_bell.mp3 /tmp/backup/love_care_bell.mp3 || true
          rm -rf android
          flutter create . --platforms=android --project-name love_care_global
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          cp /tmp/backup/google-services.json android/app/google-services.json || true
          mkdir -p android/app/src/main/res/raw
          cp /tmp/backup/love_care_bell.mp3 android/app/src/main/res/raw/love_care_bell.mp3 || true
          mkdir -p assets
          # Flutter 3.35 uses GROOVY files - keep those, delete KTS duplicates
          rm -f android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts
          ls -R android | head -n 100
          echo "--- settings.gradle ---"
          cat android/settings.gradle

      - name: Force Kotlin 2.3.0 everywhere
        run: |
          python3 << 'PY'
          import re, pathlib
          # Patch settings.gradle - Kotlin plugin version
          for name in ["android/settings.gradle", "android/build.gradle", "android/app/build.gradle"]:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              # Any kotlin version -> 2.3.0
              t = re.sub(r'org\.jetbrains\.kotlin\.android" version "[^"]+"', 'org.jetbrains.kotlin.android" version "2.3.0"', t)
              t = re.sub(r"org\.jetbrains\.kotlin\.android' version '[^']+'", "org.jetbrains.kotlin.android' version '2.3.0'", t)
              t = re.sub(r'kotlin_version\s*=\s*["\'][^"\']+["\']', 'kotlin_version = "2.3.0"', t)
              t = re.sub(r'ext\.kotlin_version\s*=\s*["\'][^"\']+["\']', 'ext.kotlin_version = "2.3.0"', t)
              t = re.sub(r'kotlin-gradle-plugin:[^"\']+', 'kotlin-gradle-plugin:2.3.0', t)
              # AGP -> 8.9.2
              t = re.sub(r'com\.android\.application" version "[^"]+"', 'com.android.application" version "8.9.2"', t)
              p.write_text(t)
              print(f"--- {name} ---")
              print(t)
          PY
          grep -rn "2.3.0\|kotlin" android/settings.gradle android/build.gradle || true
          flutter pub get

      - name: Build AAB (release)
        run: flutter build appbundle --release
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: love-care-global-aab
          path: build/app/outputs/bundle/release/app-release.aab
