<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE CARE GLOBAL - ALL FORMS - INTERNATIONAL - 8 COUNTRIES</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;font-size:22px;line-height:1.6;max-width:950px;margin:0 auto;padding:12px;background:#e8eef3;color:#000;}
h1{background:#0B4D6E;color:#fff;padding:22px;text-align:center;font-size:28px;border-radius:14px;margin:0 0 15px 0;line-height:1.3;}
h1 span{display:block;font-size:13px;margin-top:8px;font-weight:normal;}
.tab-bar{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:#e8eef3;padding:8px 0;}
.tab-btn{flex:1;min-width:130px;background:#ccc;color:#000;padding:16px 8px;font-size:18px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;}
.tab-btn.active{background:#0B4D6E;color:#fff;transform:scale(1.03);}
.form-section{display:none;}
.form-section.active{display:block;}
h2{background:#0E8A6E;color:#fff;padding:14px 18px;border-radius:8px;font-size:23px;margin-top:25px;}
.card{background:white;border:3px solid #0B4D6E;border-radius:14px;padding:22px;margin:15px 0;box-shadow:0 3px 10px rgba(0,0,0,0.1);}
label{font-weight:bold;font-size:20px;display:block;margin:14px 0 6px 0;color:#0B4D6E;}
input,textarea,select{width:100%;font-size:21px;padding:16px;border:3px solid #222;border-radius:10px;background:#ffffd6;margin-bottom:10px;font-family:Arial;}
input:focus,textarea:focus,select:focus{background:#fff;border-color:#0E8A6E;border-width:4px;outline:none;}
.check-item{background:#f8f9fa;border:2px solid #aaa;padding:14px;margin:10px 0;border-radius:8px;display:flex;align-items:center;font-size:19px;line-height:1.4;}
.check-item.red{background:#fff0f0;border-color:#b00000;}
.check-item.green{background:#d4edda;border:2px solid #0E8A6E;}
.check-item input{width:32px;height:32px;min-width:32px;margin-right:14px;transform:scale(1.6);}
.sig-box{border:3px dashed #0B4D6E;background:#fffbe6;padding:16px;margin:18px 0;border-radius:10px;}
button.main{background:#0B4D6E;color:white;padding:18px;font-size:23px;border:none;border-radius:12px;width:100%;margin:10px 0;font-weight:bold;cursor:pointer;}
button.green{background:#0E8A6E;}
canvas{border:3px solid #000;width:100%;height:170px;background:white;border-radius:10px;touch-action:none;display:block;margin:10px 0;}
.tip{background:#ffeb3b;padding:12px;border-radius:8px;text-align:center;font-weight:bold;font-size:19px;margin:10px 0;border:3px solid #000;}
.small{font-size:13px;color:#555;text-align:center;margin-top:25px;line-height:1.5;}
.req{color:#b00000;}
</style>
</head>
