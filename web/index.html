<!DOCTYPE html>
<html>
<head>
  <!--
    LOVE CARE GLOBAL - Flutter Web
    This is web/index.html - NOT root index.html.
    Flutter builds lib/screens/index.dart into this file.
    DO NOT put this in root. Put it in web/ folder.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LOVE CARE GLOBAL HOME NURSING - Join as Nurse, Book a Nurse. Live Tracking, Paystack 50%, 2-Step Verified.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LOVE CARE GLOBAL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LOVE CARE GLOBAL - HOME NURSING</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen while index.dart loads */
    body{margin:0;background:#0E0A1C;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
    .load h1{font-size:28px;margin:10px 0 6px}.load h1 span{color:#C084FC}.load p{color:#D8B4FE}
    .spin{width:44px;height:44px;border:4px solid #3B2A5E;border-top-color:#A855F7;border-radius:50%;animation:s 1s linear infinite;margin:0 auto}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <!-- Shown while Flutter loads index.dart -->
  <div class="load" id="loading">
    <div class="spin"></div>
    <h1>LOVE CARE <span>GLOBAL</span></h1>
    <p>HOME NURSING<br>Loading Main Page...</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
